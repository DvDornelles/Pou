<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pou 2</title>
</head>
<body>
        <ul id="hud">
            <li>Alimentação: <span id="hudAlimentacao"></span>/100<button onclick="alimentar()">Dar comida</button></li>
            <li>Higiene: <span id="hudHigiene"></span>/100<button onclick="banho()">Dar banho</button></li>
            <li>Estresse: <span id="hudEstresse"></span>/100<button onclick="musica()">Escutar música</button></li>
            <li>Sono: <span id="hudSono"></span>/100<button onclick="dormir()">Dormir</button></li>
            <li>Tédio: <span id="hudTedio"></span>/100<button onclick="brincar()">Brincar</button></li>
            <li>Saúde: <span id="hudSaude"></span>/100<button onclick="exercitar()">Exercitar</button></li>
        </ul>

        <img src="pounormal.jpg" alt="Seu Pou" id="foto">
    <script>
        let pou = {
            saciado: 75,
            higiene: 75,
            estresse: 15,
            sono: 0,
            tedio: 50,
            saude: 75,
        }
        refresh()

        let fuga = `
        <div id="hud">
        <h1>O bixo fugiu!!</h1>
        <button onclick="recomecar()">Recomeçar</button>
        </div>
        `

        function alimentar(){
            pou.saciado += 15
            pou.higiene -= 20
            pou.estresse -= 5
            pou.tedio -= 20
            pou.saude -= 5
            refresh()
        }

        function banho(){
            pou.estresse += 30
            pou.higiene += 50
            pou.saciado -= 5
            pou.saude -=1
            refresh()
        }

        function musica(){
            pou.estresse -= 50
            pou.higiene -= 5
            pou.saciado -= 5
            pou.tedio -= 10
            pou.saude -= 10
            refresh()
        }

        function dormir(){
            pou.sono = 0
            pou.estresse -= 5
            pou.higiene -= 10
            pou.saciado -= 15
            pou.tedio += 15
            pou.saude += 5
            refresh()
        }

        function brincar(){
            pou.sono += 30
            pou.higiene -= 30
            pou.tedio = 0
            pou.estresse -= 15
            pou.saude += 10
            refresh()
        }

        function exercitar(){
            pou.saude = 75
            pou.higiene -= 15
            pou.saciado -=5
            pou.tedio -= 10
            pou.estresse -= 5
            pou.sono += 20
            refresh()
        }

        let pouFaminto = "poufome.jpg"
        let pouSujo = "pousujo.jpg"
        let pouBrabo = "pouBrabo.png"
        let pouCansado = "poucansado.jpg"
        let pouEmMausBucados = "poupassandomal.jpg"

        function tempo(){
            pou.saciado -= 5
            pou.higiene -= 1
            pou.estresse += 1
            pou.sono += 10
            pou.tedio += 5
            pou.saude -= 1
            refresh()

            if(pou.saciado<1 || pou.saciado>99){
                document.getElementById("hud").innerHTML = fuga + `
                <p>Você não alimentou o Pou corretamente!</p>
                `
                document.getElementById("foto").src = pouFaminto
            }
            else if(pou.higiene<1 || pou.higiene>99){
                document.getElementById("hud").innerHTML = fuga + `
                <p>Você não o ensinou a ter uma higiene controlada!</p>
                `
                document.getElementById("foto").src = pouSujo
            }
            else if(pou.estresse>99 || pou.estresse<1){
                document.getElementById("hud").innerHTML = fuga + `
                <p>Pou não conteve suas emoções!</p>
                `
                document.getElementById("foto").src = pouBrabo
            }
            else if(pou.sono>99 || pou.sono<0){
                document.getElementById("hud").innerHTML = fuga + `
                <p>O Pou não se adaptou ao seu ciclo de sono!</p>
                `
                document.getElementById("foto").src = pouBrabo
            }
            else if(pou.tedio>99 || pou.tedio<0){
                document.getElementById("hud").innerHTML = fuga + `
                <p>Pou foi procurar algo diferente para fazer...</p>
                `
                document.getElementById("foto").src = pouBrabo
            }
            else if(pou.saude>99 || pou.saude<0){
                document.getElementById("hud").innerHTML = fuga + `
                <p>Praticar esportes faz bem à saúde de Pou...</p>
                `
                document.getElementById("foto").src = pouBrabo
            }


            
            else if(pou.higiene<35 && pou.saude<35 && pou.saciado<35 && pou.sono>65 && pou.estresse>65){
                document.getElementById("foto").src = pouEmMausBucados
            }

            else if(pou.estresse<70 || pou.tedio > 70){
                document.getElementById("foto").src = pouBrabo
            }
            else if(pou.higiene < 30){
                document.getElementById("foto").src = pouSujo
            }

            else if(pou.sono > 70 || pou.saude < 30){
                document.getElementById("foto").src = pouCansado
            }

            else if(pou.saciado < 30){
                document.getElementById("foto").src = pouFaminto
            }
        }
        setInterval(tempo, 2000)

        function refresh(){
            document.getElementById('hudAlimentacao').innerHTML = pou.saciado
            document.getElementById('hudHigiene').innerHTML = pou.higiene
            document.getElementById('hudEstresse').innerHTML = pou.estresse
            document.getElementById('hudSono').innerHTML = pou.sono
            document.getElementById('hudTedio').innerHTML = pou.tedio
            document.getElementById('hudSaude').innerHTML = pou.saude
        }
        function recomecar(){
            pou.saciado = 75
            pou.higiene = 75
            pou.estresse = 15
            pou.sono = 0
            pou.tedio = 50
            pou.saude = 50
            document.getElementById('hud').innerHTML = `
            <ul id="hud">
            <li>Alimentação: <span id="hudAlimentacao"></span>/100<button onclick="alimentar()">Dar comida</button></li>
            <li>Higiene: <span id="hudHigiene"></span>/100<button onclick="banho()">Dar banho</button></li>
            <li>Estresse: <span id="hudEstresse"></span>/100<button onclick="musica()">Escutar música</button></li>
            <li>Sono: <span id="hudSono"></span>/100<button onclick="dormir()">dormir</button></li>
            <li>Tédio: <span id="hudTedio"></span>/100<button onclick="brincar()">Brincar</button></li>
            <li>Saúde: <span id="hudSaude"></span>/100<button onclick="exercitar()">Exercitar</button></li>
            </ul>
            `
            document.getElementById("foto").src = "pounormal.jpg"
        }
    </script>
</body>
</html>
